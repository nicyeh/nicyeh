<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 Bingo</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <h1>2026 Bingo</h1>
      <p>Enter 24 goals. Then generate your board.</p>

      <form id="bingo-form">
        <div class="inputs">
          <!-- JS will generate 24 inputs -->
        </div>

        <button type="submit">Generate Board</button>
      </form>

      <section id="board" class="hidden">
        <h2>Your Bingo Board</h2>
        <div class="grid"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
